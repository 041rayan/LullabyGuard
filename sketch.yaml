# Reproducible Arduino CLI build profile for LullabyGuard.
# Build with: arduino-cli compile --profile default
default_profile: default

profiles:
  default:
    notes: ESP32-S3-WROOM-1 firmware
    fqbn: esp32:esp32:esp32s3
    platforms:
      - platform: esp32:esp32 (3.3.12)
    libraries:
      - ArduinoJson (7.4.3)
      - Blynk (1.4.0)
      - DHT sensor library (1.4.7)
      - Adafruit Unified Sensor (1.1.15)
